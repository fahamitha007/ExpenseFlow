<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savings Goal | Personal Expense Tracker</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html">💰 Expense Tracker</a><div class="navlinks">
